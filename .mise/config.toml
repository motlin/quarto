[settings]
# Skip releases younger than 24 hours when mise chooses a version (`mise upgrade`, `latest`, ranges),
# enforcing the 24-hour version policy. An exact version pinned here still installs.
minimum_release_age = "1d"

[tools]
just = "1.58.0"
node = "24.21.0"
pnpm = "12.4.1"
pre-commit = "4.6.2"
"npm:vite-plus" = "0.3.1"
"npm:oxfmt-next-line" = { version = "0.75.0", allow_low_downloads = true }
"npm:markdownlint-cli2" = "0.23.2"
rust = { version = "1.98.1", components = "clippy,rustfmt,llvm-tools", targets = "wasm32-unknown-unknown" }
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.144"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"aqua:wasm-bindgen/wasm-pack" = "0.15.0"

[env]
TERM = 'xterm-256color'
