# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with `just deny` or `cargo deny check`.

[graph]
# Check the wasm feature's dependency tree too; it is what ships to the browser.
all-features = true

[advisories]
# Deny crates with security advisories or that have been yanked.
yanked = "deny"

[licenses]
# Allow only licenses that are compatible with Apache-2.0 distribution.
# Only licenses the dependency tree actually uses, so cargo deny has no unmatched
# allowances to warn about; add one here when a new dependency brings it in.
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.8

[bans]
# Warn about duplicate transitive dependencies and wildcard version requirements.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Only allow dependencies from crates.io by default.
unknown-registry = "deny"
unknown-git = "deny"
